name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de rollback (7 caractères hexadécimaux, vide = build normal)"
        required: false
        default: ""
        type: string
      environment:
        description: "Environnement cible pour un rollback"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions: {}

jobs:
  prepare:
    name: Préparer le plan de déploiement
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      owner: ${{ steps.plan.outputs.owner }}
      build: ${{ steps.plan.outputs.build }}
      staging: ${{ steps.plan.outputs.staging }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -z "$INPUT_TAG" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Le build d'une release n'est autorisé que depuis main"
              exit 1
            fi
            TAG="${GITHUB_SHA::7}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "staging=true" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "### Plan : Déploiement complet ($TAG)" >> "$GITHUB_STEP_SUMMARY"
          else
            if ! [[ "$INPUT_TAG" =~ ^[0-9a-f]{7}$ ]]; then
              echo "::error::Tag invalide '$INPUT_TAG' (7 caractères hexadécimaux attendus)"
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_ENV" = "staging" ]; then
              echo "staging=true" >> "$GITHUB_OUTPUT"
              echo "production=false" >> "$GITHUB_OUTPUT"
            else
              echo "staging=false" >> "$GITHUB_OUTPUT"
              echo "production=true" >> "$GITHUB_OUTPUT"
            fi
            echo "### Plan : Rollback vers $INPUT_TAG sur $INPUT_ENV" >> "$GITHUB_STEP_SUMMARY"
          fi

  images:
    name: Build & Scan (${{ matrix.component }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, front]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Construire l'image localement (sans publier)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.tag }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:latest

      - name: Scanner les vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.30.0
        with:
          image-ref: ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-${{ matrix.component }}.txt

      - name: Publier le rapport Trivy dans le résumé
        if: ${{ !cancelled() }}
        run: |
          echo "### Rapport Trivy : ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-${{ matrix.component }}.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Se connecter à ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier les images scannées sur ghcr.io
        run: |
          docker push ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
          docker push ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:latest
          echo "Publié : ghcr.io/${{ needs.prepare.outputs.owner }}/taskflow-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Déployer staging
    needs: [prepare, images]
    if: >-
      !cancelled()
      && needs.prepare.outputs.staging == 'true'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: [self-hosted, lab]
    timeout-minutes: 15
    environment:
      name: staging
      url: http://localhost:${{ vars.FRONT_PORT || '8081' }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: infra
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      FRONT_PORT: ${{ vars.FRONT_PORT || '8081' }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/../.tofu-plugin-cache
      TF_VAR_front_port: ${{ vars.FRONT_PORT || '8081' }}
      TF_VAR_ghcr_username: ${{ github.actor }}
      TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Vérifier le runner
        working-directory: .
        run: |
          if [ -z "${STAGING_DIR:-}" ] || [ ! -d "$STAGING_DIR" ]; then
            echo "::error::STAGING_DIR absent : le runner du lab est-il bien configuré ?"; exit 1
          fi
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tofu init (state dans STAGING_DIR)
        run: tofu init -lockfile=readonly -backend-config="path=$STAGING_DIR/terraform.tfstate"

      - name: Variables OpenTofu
        run: ./ci-env.sh "$TAG"

      - name: Migrer depuis le staging Compose (si présent)
        run: |
          ids="$(docker ps -aq --filter label=com.docker.compose.project=taskflow-staging)"
          if [ -n "$ids" ]; then
            echo "Staging Compose détecté : suppression des conteneurs et du réseau (le volume est conservé)"
            # shellcheck disable=SC2086
            docker rm -f $ids
            docker network rm taskflow-staging
          fi
          if ! tofu state list 2>/dev/null | grep -qx 'docker_volume.pgdata' \
             && docker volume inspect taskflow-staging-pgdata >/dev/null 2>&1; then
            echo "Volume existant : import dans le state"
            tofu import -lock-timeout=120s docker_volume.pgdata taskflow-staging-pgdata
          fi

      - name: tofu plan
        run: tofu plan -no-color -lock-timeout=120s -out=tfplan

      - name: tofu apply
        run: |
          tofu apply -no-color -lock-timeout=120s tfplan
          rm -f tfplan

      - name: Smoke test
        working-directory: .
        run: ./deploy/smoke-test.sh "http://host.docker.internal:${FRONT_PORT}/health" "$TAG"

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Staging (OpenTofu)"
            echo "| Version | URL |"
            echo "|---|---|"
            echo "| \`$TAG\` | $(tofu output -raw url 2>/dev/null || echo '?') |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f tfplan

  deploy-production:
    name: Déployer en Production
    needs: [prepare, images, deploy-staging]
    if: >-
      !cancelled()
      && needs.prepare.outputs.production == 'true'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: [self-hosted, lab]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copier la configuration et les scripts dans PROD_DIR
        run: |
          mkdir -p "$PROD_DIR/nginx"
          cp compose.prod.yaml deploy/*.sh "$PROD_DIR/"
          cp deploy/nginx/taskflow.conf "$PROD_DIR/nginx/"
          chmod +x "$PROD_DIR/"*.sh

      - name: Se connecter à ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sauvegarder et déployer la production
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd "$PROD_DIR"
          ./backup.sh
          COMPOSE_FILE=compose.prod.yaml ./deploy.sh "$TAG"

      - name: Smoke test HTTPS
        id: smoke
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PORT: ${{ vars.HTTPS_PORT || '443' }}
          CACERT: certs/taskflow.crt
        run: |
          cd "$PROD_DIR"
          ./smoke-test.sh "https://host.docker.internal:${PORT}/health" "$TAG"

      - name: Rollback automatique si le smoke test échoue
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          cd "$PROD_DIR"
          if [ -f .previous_tag ]; then
            PREV=$(cat .previous_tag)
            echo "::warning::Smoke test KO, rollback automatique vers $PREV"
            COMPOSE_FILE=compose.prod.yaml ./deploy.sh "$PREV"
          fi
          exit 1

      - name: Déconnecter ghcr.io
        if: always()
        run: docker logout ghcr.io || true